name: Refresh CQC change-event files

# Daily off-peak poll. CQC publishes monthly, so most days this exits in
# seconds with "nothing changed". When a new bulk lands, cqc_refresh diffs it
# against the committed seed (output.csv / Locations.csv) plus the prior delta
# files and writes an append-only change-event file
# data/changes/cqc-YYYY-MM-DD.json (ADR 0015) — it no longer rewrites the 40 MB
# CSVs. This job commits that small delta (plus the refresh-state file) and
# opens a PR.
#
# The database is a projection rebuilt from these files (apply_events) wherever
# the app runs; CI only produces the files. The Companies House producer
# (enrich_people) needs a live DB + API key, so it runs locally / at deploy time
# rather than here (ADR 0015 §7, deferred to the deploy phase).
#
# The PR lives on ONE stable, bot-owned branch (`data/refresh`), rebuilt from
# the base ref and force-pushed each run. That keeps at most one open refresh PR
# at a time, rather than one orphaned branch per day.
#
# See:
#   docs/adr/0015-data-freshness-strategy.md
#   docs/plans/data-freshness.md (WS2 producer, WS5 workflow)
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

# Narrowest perms the job needs: push a branch + open a PR.
# Everything else (issues, deployments, packages, etc.) stays read-only.
permissions:
  contents: write
  pull-requests: write

# Stop a long refresh from racing a same-day re-trigger.
concurrency:
  group: cqc-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Poll CQC + open PR if changed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so we can branch and push.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run refresh
        # Emits data/changes/cqc-YYYY-MM-DD.json (only when records actually
        # changed) and updates data/cqc-refresh-state.json. The seed CSVs are
        # NOT rewritten. Tee the log so the PR-body step can quote the summary.
        run: python cqc_refresh.py refresh 2>&1 | tee /tmp/refresh.log

      - name: Detect changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain -- data/changes data/cqc-refresh-state.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Detected a new change-event file / state update — preparing PR."
            git status --porcelain -- data/changes data/cqc-refresh-state.json
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing changed since the last refresh — exiting clean."
          fi

      - name: Open / update refresh PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          : "${BASE_REF:?BASE_REF unset (workflow misconfigured)}"
          : "${GH_TOKEN:?GH_TOKEN unset (workflow misconfigured)}"

          DATE=$(date -u +%Y-%m-%d)
          # One stable, bot-owned branch — NOT one per day. Reusing it means at
          # most one open refresh PR at a time; the date only labels the PR
          # title / commit, it does not fork a new branch each run.
          BRANCH="data/refresh"
          TITLE="data: CQC change-event file ($DATE)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stash the new delta + state before resetting the branch.
          # --include-untracked picks up the brand-new dated event file (and the
          # data/ dir itself on the very first run).
          git stash push --include-untracked -m "cqc-refresh" -- \
            data/changes data/cqc-refresh-state.json

          # Always rebuild the refresh branch fresh from the trigger's base ref.
          # If it already exists upstream (from a prior run whose PR hasn't
          # merged), the later force-push replaces its content.
          git fetch origin "$BASE_REF"
          git checkout -B "$BRANCH" "origin/$BASE_REF"
          git stash pop

          # Compose the PR body.
          {
            echo "Automated CQC change-event file from the monthly bulk diff (ADR 0015)."
            echo
            echo "Source (per ADR 0007 Amendment):"
            echo
            python cqc_refresh.py discover | sed 's/^/    /'
            echo
            echo "Change summary:"
            echo
            echo '```'
            grep -E "wrote .*cqc-.*\.json|no record-level changes" /tmp/refresh.log \
              || echo "(state updated; see committed files)"
            echo '```'
            echo
            echo "The seed CSVs are unchanged — the DB projection is rebuilt from these"
            echo "event files via \`apply_events\`. If CQC has changed column shape, the"
            echo "mapper in \`cqc_refresh.py\` needs updating before this is merged."
          } > /tmp/pr-body.md

          git add data/changes data/cqc-refresh-state.json
          git commit -m "$TITLE"
          # Plain --force (not --force-with-lease): this branch is rebuilt from
          # the base ref every run and exclusively bot-owned, and the
          # concurrency group above serializes runs — so there is no
          # unseen-concurrent-push to guard against, and --force-with-lease has
          # no remote-tracking ref to lease against here anyway.
          git push --force -u origin "$BRANCH"

          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "PR already open for $BRANCH — updating title and body."
            gh pr edit "$BRANCH" --title "$TITLE" --body-file /tmp/pr-body.md
          else
            gh pr create --base "$BASE_REF" --head "$BRANCH" \
              --title "$TITLE" --body-file /tmp/pr-body.md
          fi
